        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --secondary: #fbbf24;
            --bg-gradient-start: #fef3c7;
            --bg-gradient-end: #fde68a;
            --card-bg: #fffbeb;
            --text-primary: #78350f;
            --text-secondary: #92400e;
            --shadow: rgba(245, 158, 11, 0.25);
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .header {
            margin-bottom: 32px;
        }

        .title {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            opacity: 0.85;
        }

        .emoji-display {
            font-size: 4.5rem;
            margin: 24px 0;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 28px;
        }

        .category-tab {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .category-tab:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.05);
        }

        .category-tab.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .result-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 32px 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px var(--shadow);
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.15) 0%, transparent 70%);
            animation: shimmer 8s linear infinite;
        }

        @keyframes shimmer {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-emoji {
            font-size: 3.5rem;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .result-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            position: relative;
            z-index: 1;
        }

        .result-category {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 8px;
            position: relative;
            z-index: 1;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .decide-btn {
            flex: 1;
            max-width: 200px;
            padding: 16px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 24px var(--shadow);
            letter-spacing: 2px;
        }

        .decide-btn.secondary {
            background: linear-gradient(135deg, #fde68a 0%, #fbbf24 100%);
            color: var(--text-primary);
        }

        .decide-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 32px var(--shadow);
        }

        .decide-btn:active {
            transform: translateY(0);
        }

        .decide-btn.shaking {
            animation: shake 0.6s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0) rotate(0); }
            20% { transform: translateX(-8px) rotate(-5deg); }
            40% { transform: translateX(8px) rotate(5deg); }
            60% { transform: translateX(-6px) rotate(-3deg); }
            80% { transform: translateX(6px) rotate(3deg); }
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .stats-tag {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .favorites-section {
            padding-top: 20px;
            border-top: 1px dashed var(--primary);
        }

        .favorites-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .favorites-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .favorite-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            background: white;
            border-radius: 16px;
            font-size: 0.8rem;
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .favorite-item span {
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .favorite-item span:hover {
            opacity: 1;
        }

        .no-favorites {
            font-size: 0.85rem;
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .add-favorite-btn {
            margin-top: 16px;
            padding: 10px 20px;
            background: white;
            border: 2px solid var(--primary);
            border-radius: 20px;
            color: var(--primary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-favorite-btn:hover {
            background: var(--primary);
            color: white;
        }

        @media (max-width: 480px) {
            .title {
                font-size: 1.8rem;
            }
            .emoji-display {
                font-size: 3.5rem;
            }
            .result-text {
                font-size: 1.3rem;
            }
            .decide-btn {
                padding: 14px 16px;
                font-size: 1rem;
            }
        }
    </style>
</head>

                favoriteCount.textContent = '还没有收藏';
            } else {
                favoriteCount.textContent = `已收藏 ${favorites.length} 种`;
            }
        }

        function decide() {
            const filtered = getFilteredFoods();
            if (filtered.length === 0) {
                resultText.textContent = '该分类暂无食物';
                resultEmoji.textContent = '🍽️';
                resultCategory.textContent = '';
                currentResult = null;
                addFavoriteBtn.style.display = 'none';
                return;
            }

            decideBtn1.classList.add('shaking');
            decideBtn2.classList.add('shaking');
            setTimeout(() => {
                decideBtn1.classList.remove('shaking');
                decideBtn2.classList.remove('shaking');
            }, 600);

            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * filtered.length);
                currentResult = filtered[randomIndex];
                resultEmoji.textContent = currentResult.emoji;
                resultText.textContent = currentResult.name;
                resultCategory.textContent = currentResult.category;
                addFavoriteBtn.style.display = 'block';
            }, 300);
        }

        function addToFavorites() {
            if (!currentResult) return;

            const exists = favorites.some(f => f.name === currentResult.name);
            if (exists) {
                alert('已经在收藏列表里了~');
                return;
            }

            favorites.push({ ...currentResult });
            localStorage.setItem('lunchFavorites', JSON.stringify(favorites));
            renderFavorites();
            updateFavoriteCount();
            alert('收藏成功！');
        }

        function removeFavorite(name) {
            favorites = favorites.filter(f => f.name !== name);
            localStorage.setItem('lunchFavorites', JSON.stringify(favorites));
            renderFavorites();
            updateFavoriteCount();
        }

        function renderFavorites() {
            if (favorites.length === 0) {
                favoritesList.innerHTML = '<div class="no-favorites">还没有收藏</div>';
                return;
            }

            favoritesList.innerHTML = favorites.map(f => `
                <div class="favorite-item">
                    ${f.emoji} ${f.name} <span onclick="removeFavorite('${f.name}')">×</span>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
